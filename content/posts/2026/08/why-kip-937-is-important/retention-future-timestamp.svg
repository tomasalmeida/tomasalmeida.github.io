<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">How a future timestamp delays Kafka retention</title>
  <desc id="desc">A timeline compares the intended retention cutoff with a future-dated record that makes a log segment appear newer and delays deletion.</desc>
  <style>
    .title { font: 700 30px sans-serif; fill: #17324d; }
    .label { font: 600 22px sans-serif; fill: #17324d; }
    .body { font: 400 19px sans-serif; fill: #365268; }
    .small { font: 400 17px sans-serif; fill: #365268; }
    .guide { stroke: #91a8b8; stroke-width: 2; stroke-dasharray: 8 8; }
    .segment { fill: #d9e8e3; stroke: #2f7d6d; stroke-width: 2; }
    .segment-current { fill: #f4dfc9; stroke: #d07a35; stroke-width: 2; }
    .segment-future { fill: #f1caca; stroke: #b64949; stroke-width: 2; }
  </style>
  <defs>
    <marker id="future-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b64949"/>
    </marker>
  </defs>
  <rect width="1200" height="730" fill="#f5f8f6"/>
  <rect x="48" y="40" width="1104" height="650" rx="8" fill="#ffffff" stroke="#c9d7d5" stroke-width="2"/>
  <text x="88" y="88" class="title">A future timestamp can extend apparent data age</text>
  <text x="88" y="122" class="body">Example: retention is configured for 7 days, but one record is dated 30 days ahead.</text>
  <text x="88" y="190" class="label">Intended retention</text>
  <rect x="180" y="225" width="90" height="40" rx="4" class="segment"/>
  <rect x="280" y="225" width="90" height="40" rx="4" class="segment"/>
  <rect x="380" y="225" width="90" height="40" rx="4" class="segment"/>
  <rect x="480" y="225" width="90" height="40" rx="4" class="segment"/>
  <rect x="580" y="225" width="90" height="40" rx="4" class="segment-current"/>
  <rect x="680" y="225" width="90" height="40" rx="4" class="segment-current"/>
  <rect x="780" y="225" width="90" height="40" rx="4" class="segment-current"/>
  <line x1="620" y1="205" x2="620" y2="390" class="guide"/>
  <line x1="840" y1="205" x2="840" y2="390" class="guide"/>
  <text x="550" y="286" class="small">7-day cutoff</text>
  <text x="782" y="286" class="small">now</text>
  <text x="205" y="218" class="small">log segments</text>
  <text x="570" y="315" class="body">older segments become</text>
  <text x="570" y="340" class="body">eligible for deletion</text>
  <line x1="620" y1="350" x2="840" y2="350" stroke="#2f7d6d" stroke-width="8"/>
  <polygon points="620,350 642,338 642,362" fill="#2f7d6d"/>
  <polygon points="840,350 818,338 818,362" fill="#2f7d6d"/>
  <text x="674" y="385" class="small">actual retention window</text>
  <text x="88" y="435" class="label">With a future-dated record</text>
  <rect x="180" y="470" width="90" height="40" rx="4" class="segment"/>
  <rect x="280" y="470" width="90" height="40" rx="4" class="segment"/>
  <rect x="380" y="470" width="90" height="40" rx="4" class="segment"/>
  <rect x="480" y="470" width="90" height="40" rx="4" class="segment"/>
  <rect x="580" y="470" width="90" height="40" rx="4" class="segment-current"/>
  <rect x="680" y="470" width="90" height="40" rx="4" class="segment-current"/>
  <rect x="780" y="470" width="90" height="40" rx="4" class="segment-current"/>
  <rect x="880" y="470" width="90" height="40" rx="4" class="segment-future"/>
  <rect x="980" y="470" width="60" height="40" rx="4" class="segment-future"/>
  <line x1="620" y1="450" x2="620" y2="560" class="guide"/>
  <line x1="840" y1="450" x2="840" y2="560" class="guide"/>
  <line x1="1000" y1="450" x2="1000" y2="560" class="guide"/>
  <text x="205" y="463" class="small">log segments</text>
  <text x="532" y="532" class="small">old data</text>
  <text x="780" y="532" class="small">broker time</text>
  <text x="932" y="532" class="small">future timestamp</text>
  <path d="M840 555 C900 585 950 585 1000 555" fill="none" stroke="#b64949" stroke-width="5" marker-end="url(#future-arrow)"/>
  <text x="650" y="610" class="small" fill="#b64949">future timestamp makes this segment appear newer</text>
  <text x="710" y="640" class="body" fill="#b64949">cleanup is delayed; old data remains on disk</text>
  <text x="88" y="680" class="small">Each rectangle represents one Kafka log segment.</text>
</svg>
